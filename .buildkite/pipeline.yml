# Buildkite pipeline for demo-weather: install the forge CLI (vnext), run
# `forge build` in CI, docker-build the image from the generated
# .forge-output/ Dockerfile, push it to GitHub Container Registry, then
# deploy via the Initializ CLI.
#
# Non-secret config lives in the env block below. The two secrets come from
# Buildkite cluster secrets (Agents → cluster → Secrets), read at runtime
# with `buildkite-agent secret get` so they stay out of step env and are
# redacted in logs:
#   INITIALIZ_TOKEN — workspace-scoped platform token (developer or
#                     workspace_admin role), minted by an admin
#   GHCR_TOKEN      — GitHub PAT with write:packages for initializ-agents
#   OPENAI_API_KEY  — NOT configured: initializ-deploy.yaml marks it
#                     optional, so it is simply omitted from the deploy;
#                     add the secret + an export below if the agent should
#                     carry its own key instead of the platform gateway's
#
# Escaping note: a single $ interpolates at pipeline-upload time; $$ defers to
# runtime bash. Everything secret or computed on the agent uses $$.

env:
  REGISTRY: "ghcr.io"
  IMAGE: "ghcr.io/initializ-agents/demo-weather"
  # Release tag to install the forge CLI from. "vnext" is the rolling
  # prerelease of forge main. Pin deliberately — this binary is ALSO the
  # runtime baked into the agent image (see --local-bin below).
  FORGE_VERSION: "vnext"
  # The platform exposes two services: agent-builder (deploys — every
  # /api/v1/agents/* path) and api-next (/verify, used by `auth whoami`).
  # INITIALIZ_API_URL points at agent-builder; INITIALIZ_AUTH_URL at api-next.
  INITIALIZ_API_URL: "https://agent-builder.test.initializ.ai"
  INITIALIZ_AUTH_URL: "https://api-next.test.initializ.ai"
  INITIALIZ_ORG_ID: "org_30368d6d"
  INITIALIZ_WORKSPACE_ID: "ws_0e834e51"
  GHCR_USERNAME: "initializ-mk"

steps:
  # One step, not several: forge build's .forge-output/ feeds the docker build
  # AND the CLI's env-var contract check (build-manifest.json), and Buildkite
  # steps don't share a workspace. (To gate production, split the deploy
  # behind a `block` step and pass .forge-output as an artifact.)
  - label: ":hammer: forge build → :docker: push → :rocket: deploy"
    key: deploy-agent
    if: build.branch == "main"
    # No agents.queue targeting: the job goes to the cluster's default queue.
    # If you run multiple queues, pin one here (agents: {queue: <name>}) —
    # the agent needs docker and outbound network access.
    command: |
      set -euo pipefail
      mkdir -p bin
      export PATH="$$PWD/bin:$$PATH"
      TAG="sha-$${BUILDKITE_COMMIT:0:7}"
      ARCH="$$(uname -m | sed 's/aarch64/arm64/')"   # x86_64 or arm64

      echo "--- :key: Fetch secrets"
      # Fails fast with a clear error if a secret is missing from the cluster.
      GHCR_TOKEN="$$(buildkite-agent secret get GHCR_TOKEN)"
      export INITIALIZ_TOKEN="$$(buildkite-agent secret get INITIALIZ_TOKEN)"

      echo "--- :package: Install forge ($$FORGE_VERSION)"
      curl -fsSL "https://github.com/initializ/forge/releases/download/$${FORGE_VERSION}/forge-Linux-$${ARCH}.tar.gz" \
        | tar xz -C bin forge
      forge --version

      echo "--- :mag: forge validate"
      forge validate         # fail fast on config errors before building anything

      echo "--- :hammer: forge build"
      # --local-bin bakes THIS forge binary into the image as the runtime
      # instead of re-downloading a release tarball at docker build. Required
      # with vnext: the prerelease binary self-reports a snapshot version
      # (e.g. 0.17.2-SNAPSHOT-<sha>) that is not a real release tag, so the
      # tarball URL the Dockerfile would otherwise pin does not exist. It also
      # guarantees runtime == the exact CLI that ran this build.
      forge build --local-bin "forge=$$PWD/bin/forge"

      echo "--- :docker: Build and push $${IMAGE}:$${TAG}"
      echo "$$GHCR_TOKEN" | docker login "$$REGISTRY" -u "$$GHCR_USERNAME" --password-stdin
      docker build -t "$$IMAGE:$$TAG" -t "$$IMAGE:latest" .forge-output
      docker push "$$IMAGE:$$TAG"
      docker push "$$IMAGE:latest"

      echo "--- :package: Install initializ CLI"
      curl -fsSL "https://github.com/initializ/cli/releases/latest/download/initializ_linux_amd64.tar.gz" \
        | tar xz -C bin initializ

      echo "--- :rocket: Deploy to Initializ"
      initializ auth whoami   # preflight — exit 3 on invalid/revoked token fails here
      initializ agent deploy -f initializ-deploy.yaml \
        --image "$$IMAGE:$$TAG" \
        --wait --timeout 10m
      # CLI exit codes fail this step distinctly, no output parsing:
      # 2 spec/env error, 3 auth, 4 not found, 5 server-side deploy failure,
      # 6 --wait timeout.
