agent_id: demo-weather
version: 0.1.0
framework: forge

model:
  provider: openai
  name: gpt-5.4
  version: "latest"

# Inbound platform auth: every A2A call presents a platform JWT, verified
# against api-next /verify. Without this block a CI-built agent falls back
# to its internal static runtime token and rejects platform tokens with
# auth_fail not_for_me.
auth:
  required: true
  providers:
    - type: http_verifier
      settings:
        url: https://api-next.test.initializ.ai/verify
        default_org: org_30368d6d

# Reversible context compression (ctxzip): bulky tool outputs (the inlined
# investor brief dominates) are swapped for retrievable markers after first
# use, and every compression lands in the audit stream as
# context_compressed with tokenizer-estimated savings. invocation_complete
# carries the REALIZED wire savings, which the app surfaces in the ledger.
compression:
  enabled: true
  ttl: "30m"

egress:
  mode: allowlist
  allowed_domains:
    - api.openai.com
    - wttr.in

secrets:
  providers:
    - env

scheduler:
  # Use the in-process file scheduler by default. The "auto" default would
  # pick the Kubernetes CronJob backend when running in-cluster, which
  # requires scheduler.kubernetes.service_url. Switch to backend: kubernetes
  # (and set kubernetes.service_url) when you want durable CronJob scheduling.
  backend: file
